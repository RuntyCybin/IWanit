server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths are handed to the Vue router, not 404'd.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api is proxied to the backend container over the Docker
    # network. The trailing slash on proxy_pass strips the /api prefix, so
    # /api/v1/auth/login reaches the backend as /v1/auth/login.
    # Serving the SPA and the API from the same origin avoids CORS entirely.
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
